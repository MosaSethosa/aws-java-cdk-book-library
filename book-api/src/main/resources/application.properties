# Local development ? uses H2 in-memory database
spring.datasource.url=jdbc:h2:mem:booklibrarydb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.application.name=book-library-api
server.port=8080

# Feature flags (AppConfig extension). Blank application disables remote lookup: flags use defaults.
featureflags.application=${APPCONFIG_APP:}
featureflags.environment=${APPCONFIG_ENV:}
featureflags.profile=${APPCONFIG_PROFILE:}
featureflags.port=${AWS_APPCONFIG_EXTENSION_HTTP_PORT:2772}
featureflags.cache-ttl=15s
